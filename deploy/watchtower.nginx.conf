# Watchtower 反向代理配置
# 源文件：D:\watchtower\deploy\watchtower.nginx.conf
# 安装位置：/etc/nginx/sites-available/watchtower（由 sites-enabled 软链接生效）

server {
    # 对外入口：80（标准 HTTP）
    listen 80 default_server;
    listen [::]:80 default_server;

    # 没有域名时留 _，靠 default_server 兜底接住所有访问
    # 有域名后改成你的域名，例如 server_name watchtower.example.com;
    server_name _;

    # 请求体上限。采集端 POST 的 JSON 只有几百字节，8m 足够，
    # 同时挡住超大请求体这一类低级攻击
    client_max_body_size 8m;

    # 访问日志单独一份，方便以后按站点审计
    access_log /var/log/nginx/watchtower.access.log;
    error_log  /var/log/nginx/watchtower.error.log;

    location / {
        # 转给只监听回环地址的 gunicorn。应用不对公网直接暴露
        proxy_pass http://127.0.0.1:5000;

        # 保留用户原始访问的主机名与端口
        # 不写这行，后端收到的 Host 会是 127.0.0.1:5000，生成的链接全错
        proxy_set_header Host $host;

        # 传递真实访客 IP —— 这是审计日志成立的前提
        # 不写这两行，应用日志里所有访客都是 127.0.0.1，被攻击时查不到来源
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 告诉后端外层用的是 http 还是 https，以后上证书时要用
        proxy_set_header X-Forwarded-Proto $scheme;

        # 与后端建立连接的超时（秒）。本地回环，5 秒连不上说明进程有问题
        proxy_connect_timeout 5s;

        # 等待后端响应的超时（秒）。健康检查与面板接口都应在毫秒级返回
        proxy_read_timeout 30s;
    }
}
